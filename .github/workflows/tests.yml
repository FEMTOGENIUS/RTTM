# Runs the test suite on every push / pull request (GitHub -> Actions tab)
name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  lite:
    name: core install (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
  full:
    name: full paper stack (gensim + BERTopic + MiniLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-full.txt pytest fastapi httpx
      - run: python scripts/setup_nlp.py
      - run: pytest -q -rs
